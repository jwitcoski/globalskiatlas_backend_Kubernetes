# Build pipeline image (includes deploy_clay/) and upload Killington via ECS task role.
# github-actions IAM user cannot PutObject to clay_scenes; the ECS task role can.
name: Upload clay via ECS

on:
  push:
    paths:
      - "deploy_clay/**"
      - "scripts/upload_deploy_clay_aws.sh"
      - "Dockerfile.aws"
      - ".github/workflows/upload-clay-via-ecs.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'globalskiatlas-backend-k8s-pipeline' }}
          IMAGE_TAG: clay-${{ github.sha }}
        run: |
          docker build -f Dockerfile.aws -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run ECS upload task
        env:
          SUBNETS: ${{ secrets.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ secrets.ECS_SECURITY_GROUP }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'globalskiatlas-backend-k8s-output' }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
        run: |
          set -euo pipefail
          if [ -z "${SUBNETS:-}" ] || [ -z "${SECURITY_GROUP:-}" ] || [ -z "${ECS_CLUSTER:-}" ]; then
            echo "Missing ECS_SUBNETS / ECS_SECURITY_GROUP / ECS_CLUSTER secrets"
            exit 1
          fi
          TASK_DEFINITION="globalskiatlas-backend-k8s-pipeline-small"
          SUBNET_ARR=$(echo "$SUBNETS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          NETWORK_CONFIG=$(jq -n --argjson subnets "$SUBNET_ARR" --arg sg "$SECURITY_GROUP" \
            '{awsvpcConfiguration: {subnets: $subnets, securityGroups: [$sg], assignPublicIp: "ENABLED"}}')
          # Task definition image is :latest (just pushed). Override only the command.
          OVERRIDES=$(jq -n \
            --arg s3 "$S3_BUCKET" \
            '{containerOverrides: [{name: "pipeline", command: ["sh", "scripts/upload_deploy_clay_aws.sh"], environment: [{name: "S3_BUCKET", value: $s3}, {name: "CLAY_PREFIX", value: "clay_scenes"}]}]}')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          echo "Task started: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "exit=$EXIT reason=$REASON"
          test "$EXIT" = "0"

      - name: Invalidate CloudFront
        continue-on-error: true
        env:
          DIST_ID: E3BDMTLYF8G4VB
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths \
              "/clay_scenes/catalog.json" \
              "/clay_scenes/killington_resort_united_states_of_america/*" \
            || echo "CF invalidation skipped"

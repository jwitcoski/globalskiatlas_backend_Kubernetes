# Phase 4: Atlas map generation — QGIS template, data-to-map script, S3, mapper workflow.
# Paths are relative to repo root unless absolute.

# Template project (create in QGIS; script copies and replaces layer datasources).
template:
  small: atlas/map_gen/templates/ski_atlas_small_template.qgz
  medium: atlas/map_gen/templates/ski_atlas_medium_template.qgz
  large: atlas/map_gen/templates/ski_atlas_large_template.qgz
  mega: atlas/map_gen/templates/ski_atlas_mega_template.qgz
  small_landscape: atlas/map_gen/templates/ski_atlas_small_landscape_template.qgz
  medium_landscape: atlas/map_gen/templates/ski_atlas_medium_landscape_template.qgz
  large_landscape: atlas/map_gen/templates/ski_atlas_large_landscape_template.qgz
  mega_landscape: atlas/map_gen/templates/ski_atlas_mega_landscape_template.qgz
  # Used when pistes.parquet is missing or tier small_medium (legacy Wintergreen geometry).
  fallback: atlas/map_gen/templates/ski_atlas_small_medium_template.qgz
  small_medium: atlas/map_gen/templates/ski_atlas_small_medium_template.qgz
  resort: atlas/map_gen/templates/atlas_resort_template.qgz
  # overview: atlas/map_gen/templates/atlas_overview_template.qgz  # optional

# Piste counts → layout tier (override mega per resort with mega_resorts).
trail_tiers:
  small_max: 9      # <= → small (¼ page)
  medium_max: 30    # <= → medium (½ page); above → large until mega
  mega_resorts: []  # resort names → mega tier (single A4 210×297 map plate)

# CRS for template and exported layers. Use worldwide CRS for global atlas.
# EPSG:4326 = WGS 84 (buffer in degrees); EPSG:4087 = World Equidistant Cylindrical (buffer in metres).
crs: "EPSG:4326"
buffer_map_units: 0.0  # optional buffer around resort for clip (in CRS units; 0 = no buffer)

# Page sizes (mm) = PNG export = map plate only (copy goes in InDesign).
page_sizes:
  small:
    width_mm: 105
    height_mm: 74.25
  medium:
    width_mm: 105
    height_mm: 148.5
  large:
    width_mm: 210
    height_mm: 148.5
  mega:
    width_mm: 210
    height_mm: 297
  small_landscape:
    width_mm: 74.25
    height_mm: 105
  medium_landscape:
    width_mm: 148.5
    height_mm: 105
  large_landscape:
    width_mm: 148.5
    height_mm: 210
  mega_landscape:
    width_mm: 297
    height_mm: 210

# Print resolution for export (mapper workflow).
dpi: 300

# S3 buckets (configurable; ensure IAM allows s3:PutObject, s3:GetObject, s3:ListBucket).
# Work: per-resort .qgz + GeoJSON/GeoPackage for mappers to download and edit.
# Final: exported map images (PNG/PDF) after mapper export.
s3:
  work_bucket: globalskiatlas-atlas-work
  work_prefix: work
  final_bucket: globalskiatlas-atlas-images
  final_prefix: final

# Wiki resort maps — both orientations per resort for curation, then pick live image.
# Pipeline uploads: {pageId}-portrait.png and {pageId}-landscape.png
# (see GlobalSkiAtlas_2/docs/S3_RESORT_MAPS_BUCKET.md; set {pageId}.png when chosen for wiki)
wiki_maps:
  bucket: globalskiatlas-resort-maps
  region: us-east-1
  require_both_orientations: true

# Local work directory; layout mirrors output/{region}/ (e.g. atlas_work/north-america/us/virginia/{slug}/).
work_dir: atlas_work

# Input directory for combined Parquet (default when running from repo root).
input_dir: output/combined

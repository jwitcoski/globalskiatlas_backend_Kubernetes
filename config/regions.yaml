# Geofabrik regions for ski atlas pipeline.
# Output: output/<continent>/ for full continents, output/<continent>/<slug>/ for split.
# PBFs >1GB may need more RAM or Fargate; run smaller regions locally first.

# --- Full continents (no split): output/africa/, output/south-america/, output/australia-oceania/
full_continents:
  - continent: africa
    pbf_url: https://download.geofabrik.de/africa-latest.osm.pbf
  - continent: south-america
    pbf_url: https://download.geofabrik.de/south-america-latest.osm.pbf
  - continent: australia-oceania
    pbf_url: https://download.geofabrik.de/australia-oceania-latest.osm.pbf

